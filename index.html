<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CasaGastos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: #f4f6f8;
    }

    header {
      background: #fff;
      padding: 18px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #777;
      font-size: 13px;
    }

    .screen {
      display: none;
      padding: 15px;
      padding-bottom: 90px;
    }

    .screen.active {
      display: block;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grow {
      flex: 1;
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }

    .amount {
      font-weight: bold;
      font-size: 18px;
    }

    .primary {
      width: 100%;
      border: 0;
      background: #1f6feb;
      color: #fff;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .icon {
      border: 0;
      background: #eaf1ff;
      color: #2457a6;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 25px;
      cursor: pointer;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
    }

    .form label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin: 12px 0 6px;
    }

    .form input,
    .form textarea,
    .form select {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 11px;
      background: #fff;
    }

    .form textarea {
      min-height: 75px;
      resize: vertical;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 20;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-head h3 {
      margin: 0;
    }

    .close {
      border: 0;
      background: #eee;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .ico {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f3f7;
      font-size: 20px;
    }

    .check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #aaa;
      background: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    .check.on {
      background: #22a06b;
      border-color: #22a06b;
      color: #fff;
    }

    .pay {
      border: 0;
      background: #eee;
      color: #555;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
    }

    .pay.ok {
      background: #dff5e9;
      color: #147a48;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 10px;
    }

    .notice {
      background: #eef5ff;
      color: #315b94;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      z-index: 10;
    }

    nav button {
      flex: 1;
      border: 0;
      background: #fff;
      padding: 11px 5px;
      cursor: pointer;
      color: #777;
    }

    nav button.active {
      color: #1f6feb;
      font-weight: bold;
    }

    .login-box {
      padding: 25px 15px;
    }

    .login-box h2 {
      margin-top: 0;
    }

    .logout {
      border: 0;
      background: #ffe8e8;
      color: #b42318;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="row">
      <div class="grow">
        <h1>CasaGastos</h1>
        <p id="userInfo">Control de gastos del hogar</p>
      </div>

      <button class="logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-box">

      <div class="card">
        <h2>Iniciar sesión</h2>

        <form class="form" onsubmit="login(event)">

          <label>Correo</label>
          <input id="email" type="email" required>

          <label>Contraseña</label>
          <input id="password" type="password" required>

          <br><br>

          <button class="primary" type="submit">
            Ingresar
          </button>

        </form>
      </div>

    </div>
  </div>

  <!-- INICIO -->
  <div id="homeScreen" class="screen">

    <div class="topbar">
      <h2>Resumen</h2>

      <button class="icon" onclick="openM('expense')">
        ＋
      </button>
    </div>

    <div class="card">
      <div class="small">Total de gastos</div>
      <div class="amount" id="totalHome">$0</div>
    </div>

    <div class="card">
      <div class="small">Gastos pendientes</div>
      <div class="amount" id="pendingHome">$0</div>
    </div>

    <div class="card">
      <div class="small">Gastos pagados</div>
      <div class="amount" id="paidHome">$0</div>
    </div>

    <div class="card">
      <h3>Últimos gastos</h3>
      <div id="recentExpenses"></div>
    </div>

  </div>

  <!-- GASTOS -->
  <div id="expensesScreen" class="screen">

    <div class="topbar">
      <h2>Gastos</h2>

      <button class="icon" onclick="openM('expense')">
        ＋
      </button>
    </div>

    <div id="expenses"></div>

  </div>

  <!-- COMPRAS -->
  <div id="shoppingScreen" class="screen">

    <div class="topbar">
      <h2>Lista de compras</h2>

      <button class="icon" onclick="openM('shopModal')">
        ＋
      </button>
    </div>

    <div class="notice">
      Lista compartida en la nube con Supabase.
    </div>

    <div class="card" id="shopping"></div>

  </div>

  <!-- MODAL GASTO -->
  <div id="expense" class="modal">

    <div class="modal-box">

      <div class="modal-head">
        <h3>Nuevo gasto</h3>

        <button class="close" onclick="closeM('expense')">
          ×
        </button>
      </div>

      <form class="form" onsubmit="addExpense(event)">

        <label>Categoría</label>
        <select id="cat" required></select>

        <label>Valor</label>
        <input id="amount" type="number" min="1" required>

        <label>Fecha</label>
        <input id="date" type="date" required>

        <label>División</label>
        <select id="split">
          <option value="shared">Compartido</option>
          <option value="me">Solo yo</option>
          <option value="partner">Solo pareja</option>
        </select>

        <label>Pagado por</label>
        <select id="payer">
          <option value="me">Yo</option>
          <option value="partner">Pareja</option>
        </select>

        <label>Notas</label>
        <textarea id="note" placeholder="Observaciones"></textarea>

        <br>

        <button class="primary" type="submit">
          Guardar gasto
        </button>

      </form>

    </div>

  </div>

  <!-- MODAL COMPRAS -->
  <div id="shopModal" class="modal">

    <div class="modal-box">

      <div class="modal-head">
        <h3>Nueva compra</h3>

        <button class="close" onclick="closeM('shopModal')">
          ×
        </button>
      </div>

      <form class="form" onsubmit="addShop(event)">

        <label>Producto</label>
        <input id="prod" required>

        <label>Cantidad</label>
        <input id="qty" type="number" min="1" value="1">

        <label>Descripción</label>
        <textarea
          id="desc"
          placeholder="Marca, tamaño, presentación..."
        ></textarea>

        <br>

        <button class="primary" type="submit">
          Agregar a la lista
        </button>

      </form>

    </div>

  </div>

  <!-- NAVEGACIÓN -->
  <nav id="nav">

    <button onclick="show('homeScreen', this)">
      🏠<br>
      Inicio
    </button>

    <button onclick="show('expensesScreen', this)">
      💰<br>
      Gastos
    </button>

    <button onclick="show('shoppingScreen', this)">
      🛒<br>
      Compras
    </button>

  </nav>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://knpmkqursxxnomwgmswt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_ch91p7gNPmY48rFK7VZWdg_3LSTz4Hw";

  const sb = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =========================
     VARIABLES
  ========================= */

  let currentUser = null;
  let currentHouseholdId = null;

  let E = [];

  /* Compras ahora vienen de Supabase */
  let S = [];

  let pics = [];
  let active = "home";


  /* =========================
     UTILIDADES
  ========================= */

  function money(value) {

    return Number(value || 0).toLocaleString(
      "es-CO",
      {
        style: "currency",
        currency: "COP",
        maximumFractionDigits: 0
      }
    );

  }


  function notify(title, message) {

    console.log(title, message);

  }


  /* =========================
     LOGIN
  ========================= */

  async function login(ev) {

    ev.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const { data, error } =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      alert(
        "No se pudo iniciar sesión: " +
        error.message
      );

      return;
    }

    currentUser = data.user;

    await loadHousehold();

    await loadExpenses();

    await loadShopping();

    render();

    show("homeScreen");

  }


  async function logout() {

    await sb.auth.signOut();

    currentUser = null;
    currentHouseholdId = null;

    E = [];
    S = [];

    show("loginScreen");

  }


  /* =========================
     CARGAR HOGAR
  ========================= */

  async function loadHousehold() {

    if (!currentUser) {
      return;
    }

    const { data, error } =
      await sb
        .from("miembros_hogar")
        .select("hogar_id,rol")
        .eq("usuario_id", currentUser.id)
        .limit(1)
        .maybeSingle();

    if (error) {

      console.error(
        "Error cargando hogar:",
        error
      );

      alert(
        "No se pudo cargar el hogar: " +
        error.message
      );

      return;
    }

    if (!data) {

      alert(
        "El usuario no tiene un hogar asignado."
      );

      return;
    }

    currentHouseholdId =
      data.hogar_id;

    document.getElementById("userInfo").textContent =
      currentUser.email;

  }


  /* =========================
     CARGAR GASTOS
  ========================= */

  async function loadExpenses() {

    if (!currentHouseholdId) {
      return;
    }

    const { data, error } =
      await sb
        .from("gastos")
        .select(`
          id,
          hogar_id,
          usuario_id,
          categoria_id,
          monto,
          fecha,
          notas,
          split,
          payer,
          paid,
          categorias (
            nombre,
            icono
          )
        `)
        .eq(
          "hogar_id",
          currentHouseholdId
        )
        .order(
          "fecha",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(
        "Error cargando gastos:",
        error
      );

      alert(
        "No se pudieron cargar los gastos: " +
        error.message
      );

      return;
    }

    E = (data || []).map(g => ({

      id: g.id,

      cat:
        g.categorias?.nombre ||
        "Sin categoría",

      amount:
        Number(g.monto),

      date:
        g.fecha,

      split:
        g.split ||
        "shared",

      payer:
        g.payer ||
        "me",

      paid:
        g.paid ||
        false,

      note:
        g.notas ||
        "",

      photos: []

    }));

  }


  /* =========================
     CARGAR COMPRAS DESDE SUPABASE
  ========================= */

  async function loadShopping() {

    if (!currentHouseholdId) {
      return;
    }

    const { data, error } =
      await sb
        .from("compras")
        .select("*")
        .eq(
          "hogar_id",
          currentHouseholdId
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      console.error(
        "Error cargando compras:",
        error
      );

      alert(
        "No se pudieron cargar las compras: " +
        error.message
      );

      return;
    }

    S = (data || []).map(x => ({

      id:
        x.id,

      p:
        x.producto,

      q:
        Number(x.cantidad || 1),

      d:
        x.notas || "",

      done:
        x.comprado || false,

      by:
        x.usuario_id === currentUser?.id
          ? "Yo"
          : "Usuario"

    }));

  }


  /* =========================
     CATEGORÍAS
  ========================= */

  async function fill() {

    const select =
      document.getElementById("cat");

    if (!select) {
      return;
    }

    const valorActual =
      select.value;

    const { data, error } =
      await sb
        .from("categorias")
        .select(
          "id,nombre,icono"
        )
        .order(
          "id",
          {
            ascending: true
          }
        );

    if (error) {

      console.error(
        "Error cargando categorías:",
        error
      );

      return;
    }

    select.innerHTML =
      (data || []).map(c => `
        <option value="${c.id}">
          ${c.icono || ""} ${c.nombre}
        </option>
      `).join("");

    if (
      valorActual &&
      [...select.options].some(
        o => o.value === valorActual
      )
    ) {

      select.value =
        valorActual;

    }

  }


  /* =========================
     AGREGAR GASTO
  ========================= */

  async function addExpense(ev) {

    ev.preventDefault();

    if (
      !currentUser ||
      !currentHouseholdId
    ) {

      alert(
        "No hay una sesión activa."
      );

      return;
    }

    const categoria =
      Number(
        document.getElementById("cat").value
      );

    const monto =
      Number(
        document.getElementById("amount").value
      );

    const fecha =
      document.getElementById("date").value;

    const notas =
      document
        .getElementById("note")
        .value
        .trim();

    const split =
      document
        .getElementById("split")
        .value;

    const payer =
      document
        .getElementById("payer")
        .value;


    if (
      !categoria ||
      !monto ||
      monto <= 0 ||
      !fecha
    ) {

      alert(
        "Completa los datos correctamente."
      );

      return;
    }


    const { data, error } =
      await sb
        .from("gastos")
        .insert({

          hogar_id:
            currentHouseholdId,

          usuario_id:
            currentUser.id,

          categoria_id:
            categoria,

          monto:
            monto,

          fecha:
            fecha,

          notas:
            notas,

          split:
            split,

          payer:
            payer,

          paid:
            false

        })
        .select()
        .single();


    if (error) {

      console.error(
        "Error guardando gasto:",
        error
      );

      alert(
        "No se pudo guardar el gasto: " +
        error.message
      );

      return;
    }


    console.log(
      "Gasto guardado:",
      data
    );


    ev.target.reset();

    closeM("expense");

    await loadExpenses();

    render();

    notify(
      "Nuevo gasto",
      money(monto)
    );

  }


  /* =========================
     MARCAR GASTO PAGADO
  ========================= */

  async function paid(id) {

    const gasto =
      E.find(
        x => x.id === id
      );

    if (!gasto) {
      return;
    }

    const nuevoEstado =
      !gasto.paid;


    const { error } =
      await sb
        .from("gastos")
        .update({
          paid:
            nuevoEstado
        })
        .eq(
          "id",
          id
        )
        .eq(
          "hogar_id",
          currentHouseholdId
        );


    if (error) {

      console.error(
        "Error actualizando pago:",
        error
      );

      alert(
        "No se pudo actualizar el pago: " +
        error.message
      );

      return;
    }


    gasto.paid =
      nuevoEstado;

    render();


    notify(
      nuevoEstado
        ? "Gasto pagado"
        : "Gasto pendiente",
      money(gasto.amount)
    );

  }


  /* =========================
     EDITAR GASTO
  ========================= */

  async function editExpense(id) {

    const gasto =
      E.find(
        x => x.id === id
      );

    if (!gasto) {
      return;
    }


    const nuevoMonto =
      prompt(
        "Nuevo valor:",
        gasto.amount
      );


    if (
      nuevoMonto === null
    ) {
      return;
    }


    const monto =
      Number(nuevoMonto);


    if (
      !monto ||
      monto <= 0
    ) {

      alert(
        "Escribe un valor válido"
      );

      return;
    }


    const { error } =
      await sb
        .from("gastos")
        .update({
          monto:
            monto
        })
        .eq(
          "id",
          id
        )
        .eq(
          "hogar_id",
          currentHouseholdId
        );


    if (error) {

      console.error(
        "Error editando gasto:",
        error
      );

      alert(
        "No se pudo actualizar el gasto: " +
        error.message
      );

      return;
    }


    await loadExpenses();

    render();


    alert(
      "Gasto actualizado correctamente"
    );

  }


  /* =========================
     ELIMINAR GASTO
  ========================= */

  async function deleteExpense(id) {

    const gasto =
      E.find(
        x => x.id === id
      );

    if (!gasto) {
      return;
    }


    const confirmar =
      confirm(
        `¿Eliminar el gasto de ${money(gasto.amount)} en ${gasto.cat}?`
      );


    if (!confirmar) {
      return;
    }


    const { error } =
      await sb
        .from("gastos")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "hogar_id",
          currentHouseholdId
        );


    if (error) {

      console.error(
        "Error eliminando gasto:",
        error
      );

      alert(
        "No se pudo eliminar el gasto: " +
        error.message
      );

      return;
    }


    E =
      E.filter(
        x => x.id !== id
      );


    render();


    alert(
      "Gasto eliminado correctamente"
    );

  }


  /* =========================
     AGREGAR COMPRA A SUPABASE
  ========================= */

  async function addShop(ev) {

    ev.preventDefault();


    if (
      !currentUser ||
      !currentHouseholdId
    ) {

      alert(
        "No hay una sesión activa"
      );

      return;
    }


    const producto =
      document
        .getElementById("prod")
        .value
        .trim();


    const cantidad =
      document
        .getElementById("qty")
        .value;


    const descripcion =
      document
        .getElementById("desc")
        .value
        .trim();


    if (!producto) {

      alert(
        "Escribe el producto."
      );

      return;
    }


    const { data, error } =
      await sb
        .from("compras")
        .insert({

          hogar_id:
            currentHouseholdId,

          usuario_id:
            currentUser.id,

          producto:
            producto,

          cantidad:
            Number(cantidad) || 1,

          notas:
            descripcion,

          comprado:
            false

        })
        .select()
        .single();


    if (error) {

      console.error(
        "Error guardando compra:",
        error
      );

      alert(
        "No se pudo guardar la compra: " +
        error.message
      );

      return;
    }


    console.log(
      "Compra guardada:",
      data
    );


    ev.target.reset();

    closeM("shopModal");

    await loadShopping();

    render();


    notify(
      "Nueva compra",
      producto
    );

  }


  /* =========================
     MARCAR COMPRA COMO COMPRADA
  ========================= */

  async function shopDone(id) {

    const item =
      S.find(
        x => x.id === id
      );

    if (!item) {
      return;
    }


    const nuevoEstado =
      !item.done;


    const { error } =
      await sb
        .from("compras")
        .update({
          comprado:
            nuevoEstado
        })
        .eq(
          "id",
          id
        )
        .eq(
          "hogar_id",
          currentHouseholdId
        );


    if (error) {

      console.error(
        "Error actualizando compra:",
        error
      );

      alert(
        "No se pudo actualizar la compra: " +
        error.message
      );

      return;
    }


    item.done =
      nuevoEstado;


    render();


    notify(
      nuevoEstado
        ? "Producto comprado"
        : "Producto pendiente",
      item.p
    );

  }


  /* =========================
     MOSTRAR PANTALLA
  ========================= */

  async function show(id, button) {

    document
      .querySelectorAll(".screen")
      .forEach(
        s => s.classList.remove("active")
      );


    const screen =
      document.getElementById(id);


    if (!screen) {
      return;
    }


    screen.classList.add("active");


    document
      .querySelectorAll("nav button")
      .forEach(
        b => b.classList.remove("active")
      );


    if (button) {
      button.classList.add("active");
    }


    active =
      id.replace(
        "Screen",
        ""
      );


    /*
     * Cada vez que entramos a Compras,
     * consultamos Supabase para traer
     * los datos más recientes.
     */
    if (
      id === "shoppingScreen" &&
      currentUser &&
      currentHouseholdId
    ) {

      await loadShopping();

    }


    render();

  }


  /* =========================
     MODALES
  ========================= */

  function openM(id) {

    if (
      id === "expense"
    ) {

      document
        .getElementById("date")
        .value =
        new Date()
          .toISOString()
          .slice(0, 10);

      fill();

    }


    document
      .getElementById(id)
      .classList
      .add("show");

  }


  function closeM(id) {

    document
      .getElementById(id)
      .classList
      .remove("show");

  }


  /* =========================
     RENDER
  ========================= */

  function render() {

    /* TOTAL */

    const total =
      E.reduce(
        (sum, x) =>
          sum + Number(x.amount || 0),
        0
      );


    const paidTotal =
      E
        .filter(
          x => x.paid
        )
        .reduce(
          (sum, x) =>
            sum + Number(x.amount || 0),
          0
        );


    const pendingTotal =
      total -
      paidTotal;


    const totalHome =
      document.getElementById(
        "totalHome"
      );


    const pendingHome =
      document.getElementById(
        "pendingHome"
      );


    const paidHome =
      document.getElementById(
        "paidHome"
      );


    if (totalHome) {
      totalHome.textContent =
        money(total);
    }


    if (pendingHome) {
      pendingHome.textContent =
        money(pendingTotal);
    }


    if (paidHome) {
      paidHome.textContent =
        money(paidTotal);
    }


    /* GASTOS */

    const expenses =
      document.getElementById(
        "expenses"
      );


    if (expenses) {

      expenses.innerHTML =
        E.map(
          x => `

          <div class="card">

            <div class="row">

              <div class="ico">
                💰
              </div>

              <div class="grow">

                <b>
                  ${x.cat}
                </b>

                <div class="small">
                  ${x.date}
                </div>

                <div class="small">
                  ${x.note || "Sin notas"}
                </div>

                <div class="small">
                  División:
                  ${x.split === "shared"
                    ? "Compartido"
                    : x.split === "me"
                      ? "Solo yo"
                      : "Solo pareja"}
                  ·
                  Pagó:
                  ${x.payer === "me"
                    ? "Yo"
                    : "Pareja"}
                </div>

              </div>

              <div class="amount">
                ${money(x.amount)}
              </div>

            </div>

            <br>

            <button
              class="pay ${x.paid ? "ok" : ""}"
              onclick="paid(${x.id})"
            >
              ${x.paid
                ? "✓ Pagado"
                : "Marcar como pagado"}
            </button>

            <button
              class="pay"
              style="margin-top:6px;background:#e8f0ff;color:#2457a6;"
              onclick="editExpense(${x.id})"
            >
              ✏️ Editar
            </button>

            <button
              class="pay"
              style="margin-top:6px;background:#ffe8e8;color:#b42318;"
              onclick="deleteExpense(${x.id})"
            >
              🗑️ Eliminar
            </button>

          </div>

        `
        ).join("") ||

        '<div class="empty">No hay gastos registrados.</div>';

    }


    /* ÚLTIMOS GASTOS */

    const recent =
      document.getElementById(
        "recentExpenses"
      );


    if (recent) {

      recent.innerHTML =
        E
          .slice(0, 5)
          .map(
            x => `

            <div class="item">

              <div class="ico">
                💰
              </div>

              <div class="grow">

                <b>
                  ${x.cat}
                </b>

                <div class="small">
                  ${x.date}
                </div>

              </div>

              <b>
                ${money(x.amount)}
              </b>

            </div>

          `
          )
          .join("") ||

        '<div class="empty">No hay gastos.</div>';

    }


    /* COMPRAS */

    const shopping =
      document.getElementById(
        "shopping"
      );


    if (shopping) {

      shopping.innerHTML =
        S.map(
          x => `

          <div class="item">

            <button
              class="check ${x.done ? "on" : ""}"
              onclick="shopDone(${x.id})"
            >
              ${x.done ? "✓" : ""}
            </button>

            <div class="ico">
              🛒
            </div>

            <div class="grow">

              <b>
                ${x.p} × ${x.q}
              </b>

              <div class="small">
                ${x.d || "Sin descripción"}
                · ${x.by}
              </div>

            </div>

          </div>

        `
        ).join("") ||

        '<div class="empty">Lista vacía.</div>';

    }

  }


  /* =========================
     SESIÓN AUTOMÁTICA
  ========================= */

  sb.auth.onAuthStateChange(
    async (event, session) => {

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        await loadHousehold();

        await loadExpenses();

        await loadShopping();

        render();

        show("homeScreen");

      } else {

        currentUser =
          null;

        currentHouseholdId =
          null;

        E = [];

        S = [];

        show("loginScreen");

      }

    }
  );


  /* =========================
     INICIO
  ========================= */

  (async function init() {

    const {
      data
    } =
      await sb.auth.getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      currentUser =
        data.session.user;

      await loadHousehold();

      await loadExpenses();

      await loadShopping();

      render();

      show("homeScreen");

    } else {

      show("loginScreen");

    }

  })();

</script>

</body>
</html>
